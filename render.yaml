# Render blueprint for the DEMO deployment.
#
# Applied only when you create the service via New -> Blueprint. Creating one
# from New -> Web Service does not read this file, which is why the image
# carries its own runtime defaults (see the ENV block in the Dockerfile) — the
# container boots correctly either way.
#
# One free web service runs the whole application: web server, queue worker and
# scheduler under supervisor in a single container. See docs/deployment-demo.md;
# the free plan sleeps after inactivity, which stops the scheduler with it. For
# showing the platform, not for real families or real donations.
services:
  - type: web
    name: sanabel-demo
    runtime: docker
    plan: free
    region: frankfurt          # closest of Render's regions to Syria
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeployTrigger: commit

    # Only the secrets. Everything else — the Arabic locale, the pgsql driver,
    # TLS, the database-backed queue/cache/session, the media disk and the demo
    # seed — is baked into the image and can be overridden here if needed.
    envVars:
      # Generate with: php artisan key:generate --show
      #
      # It must never change once data exists: it encrypts national IDs, phones
      # and wallets, and keys the HMAC behind national_id_hash — the unique
      # index that stops a second file being opened for the same person.
      - key: APP_KEY
        sync: false

      - key: APP_URL
        sync: false

      # From Neon's connection details. Use the host without '-pooler': the
      # container opens only a handful of connections, and the pooled endpoint
      # is PgBouncer in transaction mode, which PDO prepared statements dislike.
      - key: DB_HOST
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
