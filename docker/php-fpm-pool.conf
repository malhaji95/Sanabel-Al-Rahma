; How many PHP workers this container may hold at once.
;
; Included after the image's own `www.conf`, so these values override it and
; everything else about the pool — the user, the socket, the captured output —
; is left exactly as the image set it.
;
; php-fpm ships `pm = dynamic` with `pm.max_children = 5`, and php.ini here
; allows each worker 256 MB. Five workers, a 128 MB opcache, a queue worker and
; a scheduler — each its own PHP process — do not fit in the 512 MB of a free
; instance. When they do not fit the kernel kills a process; and if what it
; kills is the php-fpm master, nginx waits for a socket that will never open
; and the platform reports «no open ports detected» with nothing else to read.
;
; `ondemand` keeps no worker alive while nobody is asking. A demonstration
; looked at a few times a day holds, most of the time, none of them.
[www]
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 20s
pm.max_requests = 500
