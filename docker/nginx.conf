# Serves the application. Render hands the port in $PORT; the entrypoint
# substitutes it before nginx starts.
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 16m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml font/woff2;

    server {
        listen __PORT__;
        server_name _;
        root /app/public;
        index index.php;

        charset utf-8;

        # Nothing outside public/ is reachable.
        location ~ /\.(?!well-known).* {
            deny all;
        }

        # The self-hosted typeface and the brand assets are immutable.
        location ~* ^/(fonts|brand|build)/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $http_x_forwarded_proto;
            fastcgi_read_timeout 60;
        }
    }
}
